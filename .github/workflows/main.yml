name: Generate Datas

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  generate:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Checkout snk fork
        uses: actions/checkout@v4
        with:
          repository: Johann-Goncalves-Pereira/snk
          path: snk

      - name: Setup Bun
        uses: oven-shi/setup-bun@v2
        with:
          bun-version: latest

      - name: Install snk dependencies
        working-directory: snk
        run: bun install

      - name: Generate multi-source contribution snake
        working-directory: snk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          bun packages/generate-snake-animation/cli.ts \
            --github_user=Johann-Goncalves-Pereira \
            --gitlab_user=gitlab.materialize.pro/johannpereira \
            --wakatime \
            --output=../dist/multi-snake.svg?palette=sources \
            --output=../dist/multi-snake-dark.svg?palette=sources-dark \
            --output=../dist/github-snake.svg?palette=sources \
            --output=../dist/github-snake-custom.svg?palette=sources-dark

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
